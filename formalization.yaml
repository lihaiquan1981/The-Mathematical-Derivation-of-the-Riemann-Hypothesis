# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Load-bearing chain of the forward-reverse closure"
  description: >-
    This entry compares Lean theorems about entire functions f with
    f(1 - s) = f(s) and f(conj s) = conj f(s), and about Riemann's xi. The assemblies are
    conditional: under hunit, or under hE_pos and hE_neg, together with hζ,
    every zero of xi other than 0 and 1 has real part 1/2. At an off-line
    nonreal zero, hunit contradicts the proved sign Kquad_chiAB_neg, and
    hE_pos contradicts hE_neg. These hypotheses are not proved, so the entry
    does not prove the Riemann Hypothesis.
  authors:
    - "Li Haiquan"
  license: "GPL-3.0"
  responsible_maintainers:
    - "Li Haiquan"

classification:
  arxiv: ["math.NT", "math.CV"]
  msc2020: ["11M26", "47B25", "68V15"]

sources:
  - title: "Lean 4 formalization of the double-reflection lemmas for ξ (this repository)"
    authors:
      - "Li Haiquan"
    type: "original-proof"
    relationship: "other"
    note: >-
      First made public in this repository. The informal account of each
      compared theorem is its docstring in Challenge.lean. Labels such as
      "Lemma 9.4" are the author's own numbering. Comments in the development
      modules that cite "the paper" refer to the author's unpublished
      manuscript and cannot be checked independently. Novelty has not been
      established by a literature search.
  - title: "Ueber die Anzahl der Primzahlen unter einer gegebenen Grösse"
    authors:
      - "Bernhard Riemann"
    type: "paper"
    relationship: "background"
    note: "Monatsberichte der Berliner Akademie, 1859, pp. 671–680. Context only."

status:
  scope: >-
    The declarations in comparator.json. Hypotheses on their signatures are
    not discharged.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: []
      framework: "n/a"
      tool_setup: "The author used an interactive coding agent to draft and revise the Lean files."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
        prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: "Li Haiquan is the author and responsible maintainer."

fidelity:
  divergences: >-
    Entireness is formalized as complex differentiability. The xi factor is
    (s*(s-1)/2)*completedRiemannZeta. Unitarity and the jet energy are
    hypotheses on the signatures, not theorems with those hypotheses removed.
    No named statement omits a hypothesis of the development theorem it calls.

review:
