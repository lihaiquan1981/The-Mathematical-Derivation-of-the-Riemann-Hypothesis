# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Load-bearing chain of the forward-reverse closure"
  description: >-
    Li Haiquan, Jilin University of Chemical Technology. This Comparator entry
    checks the exit theorem of each development module: the even reduction,
    the mother-equation sign certificate, the chiAB energy sign, the closed
    unitarity loop, the xi positivity lemma, both assemblies, the higher-order
    jet loop, the Taylor remainder, and the five-way equivalence under an
    explicit spectral reading. Hypotheses that the manuscript keeps on a
    signature stay on that signature. The entry does not assert the 1859
    statement of the Riemann Hypothesis.
  authors:
    - "Li Haiquan"
  license: "GPL-3.0"
  responsible_maintainers:
    - "Li Haiquan"

classification:
  arxiv: ["math.NT", "math.CV"]
  msc2020: ["11M26", "47B25", "68V15"]

sources:
  - title: "The Mathematical Derivation of the Forward-Reverse Reversible Bidirectional Closure of the Riemann Hypothesis"
    authors:
      - "Li Haiquan"
    type: "paper"
    relationship: "formalizes"
    note: >-
      comparator.json names the exit declaration of each module in the
      manuscript. ORCID https://orcid.org/0009-0000-7365-6535.
      Email lihaiquan@jluct.edu.cn.

status:
  scope: >-
    comparator.json compares the twenty-one declarations listed there. Each
    Solution proof calls the corresponding development theorem, so the lemmas
    used by that proof are in the checked cone. hζ, hE_pos, hE_neg, hBd,
    hg_simple, and hSpec stay on the signatures and are not discharged.
    The 1859 German sentence is not a declaration in Challenge.lean.
    lemma_9_5C quantifies over the project type FieldData, so it is not a
    separate Comparator name; its chiAB sign is the named theorem
    Kquad_chiAB_neg, and the Taylor remainder that fills htaylor is
    taylor_remainder_C2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: []
      framework: "n/a"
      tool_setup: "An interactive coding agent drafted and revised Lean files from the author's manuscript."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
        prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Li Haiquan is the author of the manuscript and the responsible maintainer
    of this formalization. An interactive coding agent was used to prepare the
    Lean sources and the Palomar project files.

fidelity:
  divergences: >-
    Entireness is formalized as complex differentiability. The xi factor is
    (s*(s-1)/2)*completedRiemannZeta. Unitarity and the jet energy are
    hypotheses on the signatures, not theorems with those hypotheses removed.
    No named statement omits a hypothesis of the development theorem it calls.

review:
  status: "self-assessed"
  notes: >-
    The author checked the earlier compile of these proofs on Lean 4.34.0-rc2.
    Those logs are in build_logs/. This commit ports the sources to the module
    system and pins Lean v4.35.0-rc2, which is Palomar's current minimum.
    Challenge.lean and Solution.lean were rebuilt together on that toolchain.

