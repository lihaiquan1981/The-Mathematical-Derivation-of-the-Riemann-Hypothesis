  spend_usd: "not tracked"
  notes: "Li Haiquan is the author and responsible maintainer."

fidelity:
  divergences: >-
    Entireness is formalized as complex differentiability. The xi factor is
    (s*(s-1)/2)*completedRiemannZeta. hunit, hE_pos, and hE_neg are
    hypotheses on the signatures, not theorems with those hypotheses removed.

