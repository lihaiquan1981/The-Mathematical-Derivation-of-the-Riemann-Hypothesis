# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Conditional double-reflection criteria for zeros of ξ"
  description: >-
    This entry compares Lean theorems about entire functions f with
    f(1 - s) = f(s) and f(conj s) = conj f(s), and about Riemann's xi. The
    assemblies are conditional: for simple zeros under hunit, and for zeros of
    any multiplicity under hE_pos and hE_neg, together with hζ, every zero of
    xi other than 0 and 1 has real part 1/2. theorem_9_5_final and
    theorem_9_5_multiplicity derive False from these hypotheses at a zero off
    the critical line and off the real axis. These hypotheses are not proved,
    so the entry does not prove the Riemann Hypothesis.
  authors:
    - "Li Haiquan"
  license: "GPL-3.0"
  responsible_maintainers:
    - "Li Haiquan"

classification:
  arxiv: ["math.NT", "math.CV"]
  msc2020: ["11M26", "47B25", "68V15"]

sources:
  - title: "Lean 4 formalization of the double-reflection lemmas for ξ (this repository)"
    authors:
      - "Li Haiquan"
    type: "original-proof"
    relationship: "other"
    note: >-
      First made public in this repository. The informal account of each
      compared theorem is its docstring in Challenge.lean. Labels such as
      "Lemma 9.4" are the author's own numbering. Comments in the development
      modules that cite "the paper" refer to the author's unpublished
      manuscript and cannot be checked independently. Novelty has not been
      established by a literature search.
  - title: "Ueber die Anzahl der Primzahlen unter einer gegebenen Grösse"
    authors:
      - "Bernhard Riemann"
    type: "paper"
    relationship: "background"
    note: "Monatsberichte der Berliner Akademie, 1859, pp. 671–680. Context only."

status:
  scope: >-
    The declarations in comparator.json. Hypotheses on their signatures are
    not discharged.
  sorry_count: 0
